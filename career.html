<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="看護師個人の学習・キャリア情報を記録するページ"><title>MY CAREER | 子育てナース</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="子育てナース ホーム">子育て<span>ナース</span></a><nav aria-label="メインナビゲーション"><a href="index.html#about">サイトについて</a><a href="index.html#support">サポート</a><a href="index.html#contact">お問い合わせ</a></nav></div></header>
<main><section class="page-hero"><div class="container"><p class="section-label">MY CAREER</p><h1>わたしのキャリア</h1><p class="lead">これまでの学びと、これからのキャリアを記録</p></div></section><section class="career-content container"><p class="career-notice">入力した内容は、この端末・このブラウザにだけ保存されます。COMMUNITYページには公開されません。</p>
<form id="career-form"><section class="career-form-panel"><h2>クリニカルラダー</h2><label for="ladder">現在のラダー</label><select id="ladder"><option value="">未入力</option><option>ラダー1</option><option>ラダー2</option><option>ラダー3</option><option>ラダー4</option><option>ラダー5</option><option>その他</option></select></section>
<section class="career-form-panel"><div class="career-section-heading"><h2>研修・セミナー</h2><button class="add-button" id="add-training" type="button">＋研修を追加</button></div><div id="training-list"></div></section>
<section class="career-form-panel"><div class="career-section-heading"><h2>学会</h2><button class="add-button" id="add-society" type="button">＋学会を追加</button></div><div id="society-list"></div></section>
<section class="career-form-panel"><h2>看護協会</h2><label for="association-status">加入状況</label><select id="association-status"><option value="">未入力</option><option>加入している</option><option>加入していない</option></select><label for="association-prefecture">都道府県看護協会名（任意）</label><input id="association-prefecture" type="text"></section>
<section class="career-form-panel"><div class="career-section-heading"><h2>資格・認定</h2><button class="add-button" id="add-certification" type="button">＋資格を追加</button></div><div id="certification-list"></div></section>
<section class="career-form-panel"><h2>これから学びたいこと</h2><label class="visually-hidden" for="learning-goals">これから学びたいこと</label><textarea id="learning-goals" rows="5" placeholder="例：認知症看護、感染管理、復職後のリーダー業務"></textarea></section><button class="save-button career-save" type="submit">キャリア情報を保存する</button><p id="career-status" class="career-status" role="status" aria-live="polite"></p></form>
<section class="career-summary"><h2>記録したキャリア</h2><div id="career-summary-cards" class="career-summary-grid"></div></section><a class="back-link" href="index.html">← トップへ戻る</a></section></main><footer class="site-footer"><p>&copy; <span id="current-year">2026</span> 子育てナース</p></footer><script src="js/script.js"></script><script src="js/career.js"></script></body></html>
