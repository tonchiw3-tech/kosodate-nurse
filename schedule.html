<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="仕事・家庭・学びの予定を年度単位でまとめるページ"><title>わたしの予定 | 子育てナース</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="子育てナース ホーム">子育て<span>ナース</span></a><nav aria-label="メインナビゲーション"><a href="index.html#about">サイトについて</a><a href="index.html#support">サポート</a><a href="index.html#contact">お問い合わせ</a></nav></div></header>
<main><section class="page-hero"><div class="container"><p class="section-label">MY SCHEDULE</p><h1>わたしの予定</h1><p class="lead">仕事・家庭・学びの予定を、年度単位でひとまとめ</p></div></section>
<section class="schedule-content container"><div class="schedule-year-nav" aria-label="年度の切り替え"><button type="button" id="previous-year">‹ 前年度</button><strong id="fiscal-year-label"></strong><button type="button" id="next-year">次年度 ›</button></div><button type="button" class="current-year-button" id="current-year-button">今年度に戻る</button><div class="schedule-view-tabs" role="tablist" aria-label="表示期間"><button type="button" role="tab" data-view="first" aria-selected="true">前期</button><button type="button" role="tab" data-view="second" aria-selected="false">後期</button><button type="button" role="tab" data-view="year" aria-selected="false">年間</button></div><p class="schedule-period" id="schedule-period"></p><div class="schedule-months" id="schedule-months"></div>
<section class="schedule-editor" id="schedule-editor" hidden aria-labelledby="selected-date-heading"><h2 id="selected-date-heading"></h2><form id="schedule-form"><input type="hidden" id="schedule-id"><label>予定の種類<select id="schedule-category" required><option>仕事</option><option>家庭</option><option>学び</option><option>自分の予定</option><option>その他</option></select></label><label>予定タイトル<input id="schedule-title" type="text" required placeholder="例：感染管理研修"></label><div class="schedule-time-fields"><label>開始時間<input id="schedule-start" type="time"></label><label>終了時間<input id="schedule-end" type="time"></label></div><label>メモ<textarea id="schedule-memo" rows="3" placeholder="場所や持ちものなど"></textarea></label><button class="schedule-save" type="submit">予定を保存</button><button class="schedule-cancel" type="button" id="schedule-cancel" hidden>入力を取り消す</button></form><div class="schedule-list" id="schedule-list"></div></section></section></main>
<footer class="site-footer"><p>&copy; <span id="current-year">2026</span> 子育てナース</p></footer><script src="js/script.js"></script><script src="js/schedule.js"></script></body></html>
